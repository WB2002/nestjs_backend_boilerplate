name: AI-SDLC

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-sdlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Notice guardrail changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          echo "Guardrail paths in this pull request:"
          git diff --name-only "$BASE_SHA"...HEAD | grep -E '(^|/)\.cursor/hooks\.json$|(^|/)\.cursor/hooks/|(^|/)\.cursor/BUGBOT\.md$|(^|/)\.cursorignore$|(^|/)scripts/verify[^/]*\.sh$|(^|/)scripts/ratchet\.sh$|(^|/)quality/|(^|/)\.github/|(^|/)CODEOWNERS$' || echo "(none)"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full verification (no integration on CI)
        env:
          SKIP_INTEGRATION: '1'
        run: scripts/verify-full.sh

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Docs check
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: scripts/check-docs.sh

  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pull request size
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if jq -e '.pull_request.labels[]? | select(.name=="large-change-approved")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "large-change-approved present"
            exit 0
          fi
          base=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$base" ]; then
            echo "PR base SHA missing"
            exit 1
          fi
          lines=$(git diff --numstat "$base"...HEAD | awk '{s+=$1+$2} END {print s+0}')
          echo "changed lines: $lines"
          if [ "$lines" -gt 400 ]; then
            echo "PR exceeds 400 changed lines (add large-change-approved label to override)"
            exit 1
          fi

  agent-evals:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run eval scaffold
        run: evals/run.sh
