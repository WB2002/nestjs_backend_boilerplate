name: Polyglot Conformance Audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free runner disk space
        run: ./scripts/ci/free-disk-space.sh

      - name: Checkout conformance runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.CONFORMANCE_REPO || format('{0}/backend_security_and_conformance_tests', github.repository_owner) }}
          token: ${{ secrets.CONFORMANCE_REPO_TOKEN || github.token }}
          path: .conformance-runner

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Build conformance-audit
        run: |
          cd .conformance-runner && go build -o "${RUNNER_TEMP}/conformance-audit" ./cmd/conformance-audit
          go clean -cache -modcache
          cd "${GITHUB_WORKSPACE}" && rm -rf .conformance-runner

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Run PR/Push Conformance Gate
        if: github.event_name != 'schedule'
        env:
          CONFORMANCE_AUDIT_BIN: ${{ runner.temp }}/conformance-audit
          SKIP_APP_BUILD: 'true'
        run: ./scripts/ci/run-conformance-audit.sh --stages sast,graph,pentest,load --profile baseline --output reports

      - name: Run Nightly Full Soak & DAST Audit
        if: github.event_name == 'schedule'
        env:
          CONFORMANCE_AUDIT_BIN: ${{ runner.temp }}/conformance-audit
          SKIP_APP_BUILD: 'true'
        run: ./scripts/ci/run-conformance-audit.sh --stages all --profile soak --output reports

      - name: Upload SARIF to GitHub Security
        # SARIF upload needs Settings -> Security -> Code scanning enabled on the repo (matches codeql.yml).
        if: always() && vars.CODEQL_UPLOAD == 'true' && hashFiles('reports/nestjs-backend-boilerplate/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: reports/nestjs-backend-boilerplate/results.sarif

      - name: Upload 4-part Conformance Bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report
          path: reports/nestjs-backend-boilerplate/
